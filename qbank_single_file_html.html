<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timed QBank</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --muted: #64748b;
      --text: #0f172a;
      --border: #e2e8f0;
      --soft: #f1f5f9;
      --accent: #0f172a;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --ok-bg: #e2e8f0;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 10px 24px rgba(15, 23, 42, 0.05);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 18px 0;
      font-weight: 700;
      font-size: 1rem;
    }

    .card-body {
      padding: 18px;
    }

    .stack { display: grid; gap: 14px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .muted { color: var(--muted); }
    .small { font-size: 0.9rem; }
    .tiny { font-size: 0.8rem; }
    .title-xl { font-size: 1.6rem; font-weight: 800; }

    input, textarea, select, button {
      font: inherit;
    }

    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
    }

    textarea { min-height: 220px; resize: vertical; }

    button {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 14px;
      padding: 11px 14px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-danger {
      background: white;
      color: var(--danger);
      border-color: #fecaca;
    }
    .btn-soft {
      background: var(--soft);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.8rem;
      line-height: 1;
    }
    .badge.dark {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .badge.red {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }

    .bank-item {
      width: 100%;
      text-align: left;
      border-radius: 16px;
      padding: 14px;
      background: #f8fafc;
    }
    .bank-item.active {
      background: white;
      border-color: var(--accent);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      border: 1px solid var(--border);
      background: white;
      border-radius: 16px;
      padding: 12px;
      font-size: 0.9rem;
    }
    .stat strong { font-size: 1.2rem; }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
    }

    .main-stack { display: grid; gap: 20px; }
    .layout-main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .notice {
      border: 1px solid var(--border);
      background: white;
      border-radius: 16px;
      padding: 13px 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .question-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--soft);
    }

    .option-list {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      text-align: left;
      border-radius: 18px;
      padding: 14px;
      background: white;
    }

    .option-inner {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .option-id {
      min-width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .option.selected { border-color: var(--accent); }
    .option.correct { box-shadow: inset 0 0 0 2px var(--accent); }
    .option.wrong { border-color: #ef4444; }

    .explanation {
      border: 1px solid var(--border);
      background: var(--soft);
      border-radius: 16px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .navigator-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 600px;
      overflow: auto;
      padding-right: 4px;
    }

    .nav-btn {
      height: 42px;
      border-radius: 12px;
      background: white;
      font-weight: 700;
    }
    .nav-btn.current { border-color: var(--accent); }
    .nav-btn.correct { background: var(--ok-bg); }
    .nav-btn.incorrect { background: #e5e7eb; }
    .nav-btn.flagged { box-shadow: inset 0 0 0 2px var(--accent); }

    .hidden { display: none !important; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.open { display: flex; }
    .modal-panel {
      width: min(780px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    @media (max-width: 980px) {
      .app, .layout-main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .title-xl { font-size: 1.3rem; }
      .navigator-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="stack">
      <section class="card">
        <div class="card-header">Timed QBank</div>
        <div class="card-body stack">
          <input id="bankNameInput" type="text" placeholder="Bank name" />
          <div class="row">
            <button id="importFileBtn" class="btn-primary" style="flex:1;">Import JSON</button>
            <button id="openPasteBtn">Paste</button>
          </div>
          <input id="fileInput" type="file" accept=".json,application/json" class="hidden" />
        </div>
      </section>

      <section class="card">
        <div class="card-header">Banks</div>
        <div class="card-body stack" id="banksList"></div>
      </section>

      <section class="card hidden" id="progressCard">
        <div class="card-header">Progress</div>
        <div class="card-body stack">
          <div class="progress-wrap">
            <div class="row between small"><span>Completed</span><span id="completedText">0/0</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <div class="stat-grid">
            <div class="stat">Correct<br><strong id="statCorrect">0</strong></div>
            <div class="stat">Incorrect<br><strong id="statIncorrect">0</strong></div>
            <div class="stat">Flagged<br><strong id="statFlagged">0</strong></div>
            <div class="stat">Timed out<br><strong id="statTimedOut">0</strong></div>
          </div>
          <div class="stack">
            <button id="exportProgressBtn">Export progress</button>
            <button id="openUpdateBtn">Update active bank JSON</button>
            <button id="resetProgressBtn">Reset progress</button>
            <button id="deleteBankBtn" class="btn-danger">Delete bank</button>
          </div>
        </div>
      </section>
    </aside>

    <main class="main-stack">
      <section class="card" id="mainHeaderCard">
        <div class="card-body stack">
          <div class="toolbar">
            <div>
              <div class="title-xl" id="bankTitle">Import your first qbank</div>
              <div class="muted small" id="bankSubtitle">Your progress stays saved in this browser.</div>
            </div>
            <div class="toolbar-right" id="headerActions"></div>
          </div>
          <div class="toolbar hidden" id="filtersRow">
            <div class="toolbar-left" style="flex:1; min-width: 260px;">
              <input id="searchInput" type="text" placeholder="Search stem, system, topic" />
            </div>
            <div class="toolbar-right">
              <select id="filterSelect">
                <option value="all">All</option>
                <option value="unseen">Unseen</option>
                <option value="unanswered">Unanswered</option>
                <option value="correct">Correct</option>
                <option value="incorrect">Incorrect</option>
                <option value="flagged">Flagged</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div class="layout-main">
        <section class="stack" id="questionSection">
          <div class="notice" id="modeNotice">Import a bank to get started.</div>

          <section class="card hidden" id="questionCard">
            <div class="card-body stack">
              <div class="toolbar">
                <div class="toolbar-left">
                  <span class="small muted" id="questionCounter">Question 1 of 1</span>
                  <span class="badge hidden" id="timerBadge">1:30 left</span>
                </div>
                <div class="toolbar-right">
                  <button id="prevBtn">Previous</button>
                  <button id="nextBtn" class="btn-primary">Next</button>
                </div>
              </div>

              <div class="row wrap" id="questionMeta"></div>
              <div class="question-title" id="questionStem"></div>
              <img id="questionImage" class="question-image hidden" alt="Question image" />
              <div class="option-list" id="optionsList"></div>
              <div class="row wrap">
                <button id="flagBtn">Flag question</button>
              </div>
              <div class="explanation hidden" id="explanationBox"></div>
            </div>
          </section>
        </section>

        <section class="card hidden" id="navigatorCard">
          <div class="card-header">Navigator</div>
          <div class="card-body">
            <div class="navigator-grid" id="navigatorGrid"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="jsonModal">
    <div class="modal-panel stack">
      <div class="row between">
        <strong id="modalTitle">Paste JSON</strong>
        <button id="closeModalBtn">Close</button>
      </div>
      <textarea id="modalTextarea" placeholder="Paste your JSON here..."></textarea>
      <div class="row between wrap">
        <button id="clearModalBtn">Clear</button>
        <button id="applyModalBtn" class="btn-primary">Apply</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "qbank-html-timed-v1";
    const BLOCK_SIZE = 40;
    const QUESTION_TIME_SECONDS = 90;

    const el = {
      bankNameInput: document.getElementById("bankNameInput"),
      importFileBtn: document.getElementById("importFileBtn"),
      openPasteBtn: document.getElementById("openPasteBtn"),
      fileInput: document.getElementById("fileInput"),
      banksList: document.getElementById("banksList"),
      progressCard: document.getElementById("progressCard"),
      completedText: document.getElementById("completedText"),
      progressFill: document.getElementById("progressFill"),
      statCorrect: document.getElementById("statCorrect"),
      statIncorrect: document.getElementById("statIncorrect"),
      statFlagged: document.getElementById("statFlagged"),
      statTimedOut: document.getElementById("statTimedOut"),
      exportProgressBtn: document.getElementById("exportProgressBtn"),
      openUpdateBtn: document.getElementById("openUpdateBtn"),
      resetProgressBtn: document.getElementById("resetProgressBtn"),
      deleteBankBtn: document.getElementById("deleteBankBtn"),
      bankTitle: document.getElementById("bankTitle"),
      bankSubtitle: document.getElementById("bankSubtitle"),
      headerActions: document.getElementById("headerActions"),
      filtersRow: document.getElementById("filtersRow"),
      searchInput: document.getElementById("searchInput"),
      filterSelect: document.getElementById("filterSelect"),
      modeNotice: document.getElementById("modeNotice"),
      questionCard: document.getElementById("questionCard"),
      questionCounter: document.getElementById("questionCounter"),
      timerBadge: document.getElementById("timerBadge"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      questionMeta: document.getElementById("questionMeta"),
      questionStem: document.getElementById("questionStem"),
      questionImage: document.getElementById("questionImage"),
      optionsList: document.getElementById("optionsList"),
      flagBtn: document.getElementById("flagBtn"),
      explanationBox: document.getElementById("explanationBox"),
      navigatorCard: document.getElementById("navigatorCard"),
      navigatorGrid: document.getElementById("navigatorGrid"),
      jsonModal: document.getElementById("jsonModal"),
      modalTitle: document.getElementById("modalTitle"),
      modalTextarea: document.getElementById("modalTextarea"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      clearModalBtn: document.getElementById("clearModalBtn"),
      applyModalBtn: document.getElementById("applyModalBtn"),
    };

    const app = {
      state: loadState(),
      search: "",
      filter: "all",
      currentIndex: 0,
      blockMode: "idle", // idle | running | review
      blockQuestionIds: [],
      timeLeft: QUESTION_TIME_SECONDS,
      timer: null,
      modalMode: "create", // create | update
    };

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function createEmptyProgress() {
      return {
        selected: null,
        answered: false,
        correct: null,
        flagged: false,
        seen: false,
        timedOut: false,
        completedInTimedMode: false,
        timesDone: 0,
        updatedAt: null,
        lastCompletedAt: null,
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { banks: {}, activeBankId: null, lastBlockByBank: {} };
        return JSON.parse(raw);
      } catch {
        return { banks: {}, activeBankId: null, lastBlockByBank: {} };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(app.state));
    }

    function normalizeQuestion(q, index) {
      const options = Array.isArray(q.options)
        ? q.options.map((opt, i) => {
            if (typeof opt === "string") {
              return { id: String.fromCharCode(65 + i), text: opt };
            }
            return {
              id: opt.id ?? String.fromCharCode(65 + i),
              text: opt.text ?? "",
            };
          })
        : [];

      return {
        id: q.id ?? `q_${index + 1}`,
        stem: q.stem ?? q.question ?? "",
        options,
        answer: q.answer ?? q.correctAnswer ?? q.correct ?? null,
        explanation: q.explanation ?? "",
        system: q.system ?? "General",
        topic: q.topic ?? "Misc",
        image: q.image ?? q.imageUrl ?? null,
      };
    }

    function normalizeBank(json, fallbackName = "Imported Bank") {
      let name = fallbackName;
      let questions = [];

      if (Array.isArray(json)) {
        questions = json;
      } else if (json && Array.isArray(json.questions)) {
        name = json.name || fallbackName;
        questions = json.questions;
      } else {
        throw new Error("Invalid JSON format. Use an array of questions or an object with a questions array.");
      }

      const normalized = questions.map(normalizeQuestion);
      return {
        id: uid(),
        name,
        questions: normalized,
        progress: Object.fromEntries(normalized.map((q) => [q.id, createEmptyProgress()])),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
    }

    function mergeBank(existingBank, nextJson) {
      const incoming = normalizeBank(nextJson, existingBank.name);
      const nextQuestions = incoming.questions;
      const nextProgress = {};

      for (const q of nextQuestions) {
        nextProgress[q.id] = existingBank.progress[q.id] || createEmptyProgress();
      }

      return {
        ...existingBank,
        questions: nextQuestions,
        progress: nextProgress,
        updatedAt: new Date().toISOString(),
      };
    }

    function classNames(...parts) {
      return parts.filter(Boolean).join(" ");
    }

    function activeBank() {
      return app.state.activeBankId ? app.state.banks[app.state.activeBankId] : null;
    }

    function currentBankStats() {
      const bank = activeBank();
      if (!bank) return null;
      const items = Object.values(bank.progress);
      return {
        total: items.length,
        answered: items.filter((p) => p.answered).length,
        correct: items.filter((p) => p.correct === true).length,
        incorrect: items.filter((p) => p.correct === false).length,
        flagged: items.filter((p) => p.flagged).length,
        timedOut: items.filter((p) => p.timedOut).length,
      };
    }

    function filteredQuestions() {
      const bank = activeBank();
      if (!bank) return [];
      return bank.questions.filter((q) => {
        const p = bank.progress[q.id] || createEmptyProgress();
        const haystack = `${q.stem} ${q.system} ${q.topic}`.toLowerCase();
        if (!haystack.includes(app.search.toLowerCase())) return false;
        switch (app.filter) {
          case "unseen": return !p.seen;
          case "unanswered": return !p.answered;
          case "correct": return p.correct === true;
          case "incorrect": return p.correct === false;
          case "flagged": return p.flagged;
          default: return true;
        }
      });
    }

    function blockQuestions() {
      const bank = activeBank();
      if (!bank || app.blockQuestionIds.length === 0) return [];
      const byId = new Map(bank.questions.map((q) => [q.id, q]));
      return app.blockQuestionIds.map((id) => byId.get(id)).filter(Boolean);
    }

    function navigatorQuestions() {
      return app.blockMode === "idle" ? filteredQuestions() : blockQuestions();
    }

    function currentQuestion() {
      const list = navigatorQuestions();
      return list[app.currentIndex] || null;
    }

    function currentStatus() {
      const bank = activeBank();
      const q = currentQuestion();
      if (!bank || !q) return null;
      return bank.progress[q.id];
    }

    function setState(updater) {
      app.state = updater(app.state);
      saveState();
      render();
    }

    function updateCurrentProgress(patch) {
      const bank = activeBank();
      const q = currentQuestion();
      if (!bank || !q) return;
      setState((prev) => {
        const bankId = prev.activeBankId;
        const b = prev.banks[bankId];
        return {
          ...prev,
          banks: {
            ...prev.banks,
            [bankId]: {
              ...b,
              progress: {
                ...b.progress,
                [q.id]: {
                  ...b.progress[q.id],
                  ...patch,
                  updatedAt: new Date().toISOString(),
                },
              },
            },
          },
        };
      });
    }

    function clearTimer() {
      if (app.timer) {
        clearInterval(app.timer);
        app.timer = null;
      }
    }

    function formatSeconds(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function setActiveBank(bankId) {
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      app.timeLeft = QUESTION_TIME_SECONDS;
      clearTimer();
      setState((prev) => ({ ...prev, activeBankId: bankId }));
    }

    function importBankObject(jsonObj, fallbackName = "Imported Bank") {
      const bank = normalizeBank(jsonObj, fallbackName);
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      app.timeLeft = QUESTION_TIME_SECONDS;
      clearTimer();
      setState((prev) => ({
        ...prev,
        banks: { ...prev.banks, [bank.id]: bank },
        activeBankId: bank.id,
      }));
      el.modalTextarea.value = "";
      el.bankNameInput.value = "";
    }

    function replaceActiveBankWithJson(jsonObj) {
      const bank = activeBank();
      if (!bank) return;
      const merged = mergeBank(bank, jsonObj);
      setState((prev) => ({
        ...prev,
        banks: { ...prev.banks, [bank.id]: merged },
      }));
      el.modalTextarea.value = "";
    }

    function startTimedBlock() {
      const bank = activeBank();
      if (!bank) return;
      const pool = filteredQuestions();
      const undone = pool.filter((q) => !bank.progress[q.id]?.answered);
      const source = undone.length > 0 ? undone : pool;
      const selected = source.slice(0, BLOCK_SIZE);
      if (!selected.length) return;
      app.blockQuestionIds = selected.map((q) => q.id);
      app.currentIndex = 0;
      app.blockMode = "running";
      app.timeLeft = QUESTION_TIME_SECONDS;
      setState((prev) => ({
        ...prev,
        lastBlockByBank: {
          ...prev.lastBlockByBank,
          [bank.id]: selected.map((q) => q.id),
        },
      }));
      beginTimer();
      render();
    }

    function reviewLastBlock() {
      const bank = activeBank();
      if (!bank) return;
      const last = app.state.lastBlockByBank?.[bank.id] || [];
      if (!last.length) return;
      clearTimer();
      app.blockQuestionIds = last;
      app.currentIndex = 0;
      app.blockMode = "review";
      app.timeLeft = QUESTION_TIME_SECONDS;
      render();
    }

    function finishBlock() {
      clearTimer();
      app.blockMode = "review";
      app.currentIndex = 0;
      app.timeLeft = QUESTION_TIME_SECONDS;
      render();
    }

    function moveNext() {
      const list = navigatorQuestions();
      if (app.currentIndex < list.length - 1) {
        app.currentIndex += 1;
      }
      render();
    }

    function movePrev() {
      if (app.currentIndex > 0) app.currentIndex -= 1;
      render();
    }

    function moveToNextTimedQuestion() {
      const list = blockQuestions();
      const next = app.currentIndex + 1;
      if (next >= list.length) {
        clearTimer();
        app.blockMode = "review";
        app.currentIndex = 0;
        render();
        return;
      }
      app.currentIndex = next;
      beginTimer();
      render();
    }

    function beginTimer() {
      clearTimer();
      if (app.blockMode !== "running") return;
      const status = currentStatus();
      if (!status || status.answered) return;
      app.timeLeft = QUESTION_TIME_SECONDS;
      render();
      app.timer = setInterval(() => {
        app.timeLeft -= 1;
        if (app.timeLeft <= 0) {
          clearTimer();
          autoSubmitUnanswered();
          setTimeout(moveToNextTimedQuestion, 250);
        }
        render();
      }, 1000);
    }

    function answerQuestion(optionId) {
      const q = currentQuestion();
      const status = currentStatus();
      if (!q || !status || status.answered || app.blockMode !== "running") return;
      updateCurrentProgress({
        selected: optionId,
        answered: true,
        correct: q.answer === optionId,
        seen: true,
        timedOut: false,
        completedInTimedMode: true,
        timesDone: (status.timesDone || 0) + 1,
        lastCompletedAt: new Date().toISOString(),
      });
      clearTimer();
      setTimeout(moveToNextTimedQuestion, 250);
    }

    function autoSubmitUnanswered() {
      const status = currentStatus();
      if (!status || status.answered) return;
      updateCurrentProgress({
        selected: null,
        answered: true,
        correct: false,
        seen: true,
        timedOut: true,
        completedInTimedMode: true,
        timesDone: (status.timesDone || 0) + 1,
        lastCompletedAt: new Date().toISOString(),
      });
    }

    function toggleFlag() {
      const status = currentStatus();
      if (!status) return;
      updateCurrentProgress({ flagged: !status.flagged, seen: true });
    }

    function markSeenIfNeeded() {
      const status = currentStatus();
      if (!status || status.seen) return;
      updateCurrentProgress({ seen: true });
    }

    function resetBankProgress() {
      const bank = activeBank();
      if (!bank) return;
      clearTimer();
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      setState((prev) => ({
        ...prev,
        banks: {
          ...prev.banks,
          [bank.id]: {
            ...bank,
            progress: Object.fromEntries(bank.questions.map((q) => [q.id, createEmptyProgress()])),
          },
        },
        lastBlockByBank: {
          ...prev.lastBlockByBank,
          [bank.id]: [],
        },
      }));
    }

    function deleteActiveBank() {
      const bank = activeBank();
      if (!bank) return;
      clearTimer();
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      setState((prev) => {
        const banks = { ...prev.banks };
        const lastBlockByBank = { ...prev.lastBlockByBank };
        delete banks[bank.id];
        delete lastBlockByBank[bank.id];
        return {
          ...prev,
          banks,
          activeBankId: Object.keys(banks)[0] || null,
          lastBlockByBank,
        };
      });
    }

    function exportProgress() {
      const bank = activeBank();
      if (!bank) return;
      const blob = new Blob([JSON.stringify(bank, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${bank.name.replace(/\s+/g, "_").toLowerCase()}_progress.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function openModal(mode) {
      app.modalMode = mode;
      el.modalTitle.textContent = mode === "create" ? "Paste JSON" : "Update active bank JSON";
      el.applyModalBtn.textContent = mode === "create" ? "Create new bank" : "Apply update";
      el.jsonModal.classList.add("open");
    }

    function closeModal() {
      el.jsonModal.classList.remove("open");
    }

    function applyModal() {
      try {
        const parsed = JSON.parse(el.modalTextarea.value);
        if (app.modalMode === "create") {
          importBankObject(parsed, el.bankNameInput.value.trim() || "Imported Bank");
        } else {
          replaceActiveBankWithJson(parsed);
        }
        closeModal();
      } catch (err) {
        alert(err instanceof Error ? err.message : "Invalid JSON.");
      }
    }

    function renderBanks() {
      const ids = Object.keys(app.state.banks);
      if (!ids.length) {
        el.banksList.innerHTML = '<p class="muted small">No banks yet. Import one and the app will remember your progress locally.</p>';
        return;
      }
      el.banksList.innerHTML = "";
      ids.forEach((id) => {
        const bank = app.state.banks[id];
        const answered = Object.values(bank.progress).filter((p) => p.answered).length;
        const btn = document.createElement("button");
        btn.className = classNames("bank-item", app.state.activeBankId === id && "active");
        btn.innerHTML = `<div><strong>${escapeHtml(bank.name)}</strong></div><div class="tiny muted">${answered}/${bank.questions.length} answered</div>`;
        btn.onclick = () => setActiveBank(id);
        el.banksList.appendChild(btn);
      });
    }

    function renderHeader() {
      const bank = activeBank();
      el.headerActions.innerHTML = "";
      if (!bank) {
        el.bankTitle.textContent = "Import your first qbank";
        el.bankSubtitle.textContent = "Your progress stays saved in this browser.";
        el.filtersRow.classList.add("hidden");
        return;
      }

      el.bankTitle.textContent = bank.name;
      el.bankSubtitle.textContent = `${bank.questions.length} questions`;
      el.filtersRow.classList.remove("hidden");

      const lastBlockAvailable = !!(app.state.lastBlockByBank?.[bank.id]?.length);

      if (app.blockMode === "idle") {
        const startBtn = document.createElement("button");
        startBtn.className = "btn-primary";
        startBtn.textContent = "Start timed block";
        startBtn.onclick = startTimedBlock;
        el.headerActions.appendChild(startBtn);
      }

      if (app.blockMode === "running") {
        const endBtn = document.createElement("button");
        endBtn.textContent = "End block and review";
        endBtn.onclick = finishBlock;
        el.headerActions.appendChild(endBtn);
      }

      if (app.blockMode !== "running" && lastBlockAvailable) {
        const reviewBtn = document.createElement("button");
        reviewBtn.textContent = "Review last block";
        reviewBtn.onclick = reviewLastBlock;
        el.headerActions.appendChild(reviewBtn);
      }

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = `Timed only · ${QUESTION_TIME_SECONDS}s/question · up to ${BLOCK_SIZE} questions`;
      el.headerActions.appendChild(badge);
    }

    function renderProgress() {
      const stats = currentBankStats();
      const bank = activeBank();
      if (!bank || !stats) {
        el.progressCard.classList.add("hidden");
        return;
      }
      el.progressCard.classList.remove("hidden");
      el.completedText.textContent = `${stats.answered}/${stats.total}`;
      el.progressFill.style.width = `${stats.total ? (stats.answered / stats.total) * 100 : 0}%`;
      el.statCorrect.textContent = stats.correct;
      el.statIncorrect.textContent = stats.incorrect;
      el.statFlagged.textContent = stats.flagged;
      el.statTimedOut.textContent = stats.timedOut;
    }

    function renderQuestion() {
      const bank = activeBank();
      const q = currentQuestion();
      const status = currentStatus();
      const list = navigatorQuestions();

      if (!bank || !q || !status) {
        el.questionCard.classList.add("hidden");
        el.navigatorCard.classList.add("hidden");
        el.modeNotice.textContent = bank ? "No questions match this filter, or there is no completed block to review yet." : "Import a bank to get started.";
        return;
      }

      markSeenIfNeeded();

      el.questionCard.classList.remove("hidden");
      el.navigatorCard.classList.remove("hidden");

      if (app.blockMode === "running") {
        el.modeNotice.textContent = "Timed block is live. Explanations stay hidden until the block ends. Answer once and the app moves on automatically.";
      } else if (app.blockMode === "review") {
        el.modeNotice.textContent = "Review mode. Now you can see your answers, the correct answer, and the explanation.";
      } else {
        el.modeNotice.textContent = "Preview mode only. To answer questions, start a timed block.";
      }

      el.questionCounter.textContent = app.blockMode === "idle"
        ? `Preview ${app.currentIndex + 1} of ${list.length}`
        : `Block question ${app.currentIndex + 1} of ${list.length}`;

      if (app.blockMode === "running") {
        el.timerBadge.className = "badge red";
        el.timerBadge.textContent = `${formatSeconds(app.timeLeft)} left`;
      } else if (app.blockMode === "review") {
        el.timerBadge.className = "badge";
        el.timerBadge.textContent = "Review mode";
      } else {
        el.timerBadge.className = "badge hidden";
      }

      el.prevBtn.disabled = app.currentIndex === 0;
      el.nextBtn.disabled = app.currentIndex >= list.length - 1;

      el.questionMeta.innerHTML = "";
      [
        { text: q.system },
        { text: q.topic },
        status.flagged ? { text: "Flagged" } : null,
        app.blockMode === "review" && status.answered ? { text: status.correct ? "Correct" : "Incorrect", cls: status.correct ? "dark" : "red" } : null,
        app.blockMode === "review" && status.timedOut ? { text: "Timed out", cls: "red" } : null,
      ].filter(Boolean).forEach((item) => {
        const span = document.createElement("span");
        span.className = classNames("badge", item.cls);
        span.textContent = item.text;
        el.questionMeta.appendChild(span);
      });

      el.questionStem.textContent = q.stem;

      if (q.image) {
        el.questionImage.src = q.image;
        el.questionImage.classList.remove("hidden");
      } else {
        el.questionImage.classList.add("hidden");
        el.questionImage.removeAttribute("src");
      }

      const revealMode = app.blockMode === "review";
      const locked = app.blockMode !== "running" || status.answered;

      el.optionsList.innerHTML = "";
      q.options.forEach((opt) => {
        const isSelected = status.selected === opt.id;
        const isCorrect = q.answer === opt.id;
        const btn = document.createElement("button");
        btn.className = classNames(
          "option",
          isSelected && "selected",
          revealMode && isCorrect && "correct",
          revealMode && isSelected && !isCorrect && "wrong"
        );
        btn.disabled = locked;
        btn.innerHTML = `
          <div class="option-inner">
            <div class="option-id">${escapeHtml(opt.id)}</div>
            <div style="flex:1; padding-top: 5px;">${escapeHtml(opt.text)}</div>
          </div>
        `;
        btn.onclick = () => answerQuestion(opt.id);
        el.optionsList.appendChild(btn);
      });

      el.flagBtn.textContent = status.flagged ? "Unflag" : "Flag question";

      if (revealMode && status.answered && q.explanation) {
        el.explanationBox.textContent = q.explanation;
        el.explanationBox.classList.remove("hidden");
      } else {
        el.explanationBox.classList.add("hidden");
        el.explanationBox.textContent = "";
      }
    }

    function renderNavigator() {
      const bank = activeBank();
      const list = navigatorQuestions();
      if (!bank || !list.length) {
        el.navigatorGrid.innerHTML = "";
        return;
      }
      el.navigatorGrid.innerHTML = "";
      list.forEach((q, i) => {
        const p = bank.progress[q.id] || createEmptyProgress();
        const btn = document.createElement("button");
        btn.className = classNames(
          "nav-btn",
          i === app.currentIndex && "current",
          app.blockMode === "review" && p.correct === true && "correct",
          app.blockMode === "review" && p.correct === false && "incorrect",
          p.flagged && "flagged"
        );
        btn.textContent = i + 1;
        btn.title = `${q.system} · ${q.topic}`;
        btn.onclick = () => {
          app.currentIndex = i;
          render();
        };
        el.navigatorGrid.appendChild(btn);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      renderBanks();
      renderHeader();
      renderProgress();
      renderQuestion();
      renderNavigator();
    }

    el.importFileBtn.onclick = () => el.fileInput.click();
    el.fileInput.onchange = (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          importBankObject(parsed, el.bankNameInput.value.trim() || file.name.replace(/\.json$/i, ""));
        } catch (err) {
          alert(err instanceof Error ? err.message : "Invalid JSON file.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    };

    el.openPasteBtn.onclick = () => openModal("create");
    el.openUpdateBtn.onclick = () => openModal("update");
    el.closeModalBtn.onclick = closeModal;
    el.clearModalBtn.onclick = () => { el.modalTextarea.value = ""; };
    el.applyModalBtn.onclick = applyModal;
    el.jsonModal.onclick = (e) => { if (e.target === el.jsonModal) closeModal(); };

    el.searchInput.oninput = (e) => {
      app.search = e.target.value;
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      clearTimer();
      render();
    };

    el.filterSelect.onchange = (e) => {
      app.filter = e.target.value;
      app.currentIndex = 0;
      app.blockMode = "idle";
      app.blockQuestionIds = [];
      clearTimer();
      render();
    };

    el.prevBtn.onclick = movePrev;
    el.nextBtn.onclick = moveNext;
    el.flagBtn.onclick = toggleFlag;
    el.exportProgressBtn.onclick = exportProgress;
    el.resetProgressBtn.onclick = resetBankProgress;
    el.deleteBankBtn.onclick = deleteActiveBank;

    render();
  </script>
</body>
</html>
